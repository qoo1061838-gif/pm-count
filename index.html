<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM Pasta 點貨台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
:root{
  --bg:#FAF7F2; --card:#FFFFFF; --ink:#26211C; --sub:#7A7168; --line:#E7E0D6;
  --accent:#C4392E; --accent-ink:#FFFFFF; --accent-soft:#F7E3E0;
  --ok:#2E7D46; --ok-soft:#E3F0E7; --warn:#C06A10; --warn-soft:#F8EAD8;
  --info:#3B6FB5; --info-soft:#E4ECF7; --pend:#8A6D00; --pend-soft:#F5EDCB;
  --input:#FFFFFF; --input-line:#CFC6B8;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1713; --card:#26211B; --ink:#EDE7DE; --sub:#A79C8F; --line:#3A332B;
    --accent:#E0584A; --accent-ink:#FFFFFF; --accent-soft:#45231F;
    --ok:#6FBF87; --ok-soft:#22382A; --warn:#E0993F; --warn-soft:#3E2F1B;
    --info:#82A9DB; --info-soft:#243348; --pend:#D9C05A; --pend-soft:#3B341A;
    --input:#2E2822; --input-line:#55493C;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1713; --card:#26211B; --ink:#EDE7DE; --sub:#A79C8F; --line:#3A332B;
  --accent:#E0584A; --accent-ink:#FFFFFF; --accent-soft:#45231F;
  --ok:#6FBF87; --ok-soft:#22382A; --warn:#E0993F; --warn-soft:#3E2F1B;
  --info:#82A9DB; --info-soft:#243348; --pend:#D9C05A; --pend-soft:#3B341A;
  --input:#2E2822; --input-line:#55493C;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;font-size:16px;line-height:1.55}
.app{max-width:440px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 10px;display:flex;align-items:baseline;gap:10px}
.brand{font-family:"Noto Serif TC",serif;font-weight:700;font-size:19px}
.brand em{color:var(--accent);font-style:normal}
.store{font-size:13px;color:var(--sub);letter-spacing:.06em}
.proto{margin-left:auto;font-size:11px;color:var(--pend);background:var(--pend-soft);border-radius:4px;padding:2px 7px;letter-spacing:.08em}
main{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px}
h2{font-size:14px;letter-spacing:.12em;color:var(--sub);font-weight:700;margin:6px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.datecard{display:flex;align-items:center;gap:14px}
.datebig{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.dateinfo{font-size:13px;color:var(--sub)}
.dow{font-size:17px;font-weight:700}
.toggle{margin-left:auto;text-align:right;font-size:12px;color:var(--sub)}
.toggle button{margin-top:4px;border:1px solid var(--input-line);background:var(--input);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;font-family:inherit;cursor:pointer}
.toggle button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.week{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.day{min-width:52px;flex:1;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:7px 4px;text-align:center;font-size:11px;color:var(--sub)}
.day b{display:block;font-size:14px;color:var(--ink)}
.day .n{font-variant-numeric:tabular-nums;font-size:12px;margin-top:2px;display:block}
.day.today{border-color:var(--accent);background:var(--accent-soft)}
.day.today b{color:var(--accent)}
.people{display:flex;flex-wrap:wrap;gap:8px}
.pinput{height:48px;border:1.5px solid var(--input-line);border-radius:10px;background:var(--input);color:var(--ink);font-family:inherit;font-size:18px;font-weight:700;padding:0 14px;width:100%}
.pinput::placeholder{color:var(--input-line);font-weight:400;font-size:15px}
.pinput:focus{outline:none;border-color:var(--accent)}
/* 每日點貨紀錄 */
.hd{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px;font-size:15px}
.hpersons{font-size:13px;color:var(--sub)}
.hv{padding:9px 0;border-bottom:1px dashed var(--line)}
.hv:last-child{border-bottom:none}
.hvn{font-weight:700;font-size:14px;color:var(--accent);margin-bottom:3px}
.hitem{display:flex;gap:10px;align-items:baseline;font-size:14px;padding:3px 0}
.hitem>span:first-child{flex:1;min-width:0;font-weight:500}
.hstock{color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.hres{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.hres.dim{color:var(--sub);font-weight:400}
.hby{font-size:12px;color:var(--info);white-space:nowrap}
.chip{border:1px solid var(--input-line);background:var(--input);color:var(--ink);border-radius:999px;padding:7px 16px;font-size:15px;font-family:inherit;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vrow{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.vrow:last-child{border-bottom:none}
.vrow.off{opacity:.55}
.vname{font-weight:700;font-size:16px}
.vnote{font-size:12px;color:var(--sub)}
.vstat{margin-left:auto;font-size:12px;font-variant-numeric:tabular-nums;color:var(--sub);text-align:right;white-space:nowrap}
.vstat .done{color:var(--ok);font-weight:700}
.arrow{color:var(--sub)}
.badge{font-size:11px;border-radius:4px;padding:1px 6px}
.b-rest{background:var(--line);color:var(--sub)}
.b-order{background:var(--ok-soft);color:var(--ok);font-weight:700}
.b-warn{background:var(--warn-soft);color:var(--warn);font-weight:700}
.day.red{border-color:var(--warn);background:var(--warn-soft)}
.day.red b{color:var(--warn)}
.vwarn{font-size:12px;color:var(--warn);font-weight:700;margin-top:2px}
.note{font-size:12.5px;color:var(--sub);line-height:1.6}
.note b{color:var(--pend)}
.cta{display:block;width:100%;border:none;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-family:inherit;font-size:17px;font-weight:700;padding:15px;cursor:pointer}
.cta:disabled{opacity:.4}
.ghost{display:block;width:100%;border:1px solid var(--input-line);border-radius:12px;background:var(--card);color:var(--ink);font-family:inherit;font-size:15px;padding:12px;cursor:pointer}
/* vendor page */
.vhead{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
.back{border:none;background:none;color:var(--accent);font-size:15px;font-family:inherit;cursor:pointer;padding:4px 6px 4px 0;font-weight:700}
.vhead .t{font-weight:700;font-size:17px}
.vhead .d{font-size:12px;color:var(--sub)}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.itop{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px}
.itop .result{justify-self:end;margin-left:0}
.itop>input{justify-self:end}
.item .row1{min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.inum{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;font-weight:700}
.iname{font-weight:700;font-size:20px}
.iunit{font-size:14px;color:var(--sub)}
.tag{font-size:13px;border-radius:5px;padding:2px 9px;font-weight:700}
.t-par{background:var(--ok-soft);color:var(--ok)}
.t-trig{background:var(--warn-soft);color:var(--warn)}
.t-spec{background:var(--info-soft);color:var(--info)}
.t-pend{background:var(--pend-soft);color:var(--pend)}
.irule{font-size:16px;color:var(--ink);opacity:.88;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row2{display:flex;align-items:center;gap:10px}
.stock{display:flex;align-items:center;gap:0;border:1.5px solid var(--input-line);border-radius:10px;background:var(--input);overflow:hidden}
.stock button{width:36px;height:36px;border:none;background:none;color:var(--accent);font-size:18px;font-weight:700;cursor:pointer;font-family:inherit}
.stock input{width:48px;height:36px;border:none;background:none;color:var(--ink);text-align:center;font-size:16px;font-weight:700;font-family:inherit;font-variant-numeric:tabular-nums}
.stock input:focus{outline:none}
.stock input::placeholder{color:var(--input-line);font-weight:400;font-size:13px}
.sunit{font-size:15px;font-weight:700;color:var(--accent);padding-right:2px;white-space:nowrap}
.result{margin-left:auto;text-align:right;font-size:13px;color:var(--sub)}
.result b{display:block;font-size:17px;color:var(--ink)}
.result.order b{color:var(--accent)}
.result.zero b{color:var(--ok)}
.sw{display:flex;align-items:center;gap:8px;font-size:14px}
.sw button{width:52px;height:30px;border-radius:999px;border:1.5px solid var(--input-line);background:var(--input);cursor:pointer;position:relative}
.sw button::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--sub);transition:left .15s}
.sw button.on{background:var(--accent);border-color:var(--accent)}
.sw button.on::after{left:26px;background:#fff}
.bottom{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
/* summary */
.msg{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.msg .mh{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700}
.copy{margin-left:auto;border:1px solid var(--input-line);border-radius:8px;background:var(--input);color:var(--ink);font-family:inherit;font-size:13px;padding:6px 14px;cursor:pointer}
.copy.done{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.msg pre{margin:0;padding:12px 14px;font-family:inherit;font-size:14.5px;line-height:1.7;white-space:pre-wrap;word-break:break-all}
.empty{color:var(--sub);font-size:14px;padding:12px 14px}
footer{padding:8px 16px 24px;font-size:11.5px;color:var(--sub);line-height:1.7}
</style>

<div class="app" id="app"></div>

// ---------- 年度紅字行事曆(115年官方核定版,2026 全年無補班日)----------
// 紅字=國定假日本日+補假日(含落在週日的,如 10/25 光復節——寧可多備、不要漏訂)。
// ⚠ 每年要換新年度行事曆;正式系統改放資料表、由 admin 在後台維護。
const RED={
 '2026-01-01':'元旦',
 '2026-02-15':'小年夜','2026-02-16':'除夕','2026-02-17':'初一','2026-02-18':'初二','2026-02-19':'初三','2026-02-20':'春節補假',
 '2026-02-27':'228補假','2026-02-28':'和平紀念日',
 '2026-04-03':'兒童節補假','2026-04-04':'兒童節','2026-04-05':'清明節','2026-04-06':'清明補假',
 '2026-05-01':'勞動節',
 '2026-06-19':'端午節',
 '2026-09-25':'中秋節','2026-09-28':'教師節',
 '2026-10-09':'國慶補假','2026-10-10':'國慶日',
 '2026-10-25':'光復節','2026-10-26':'光復補假',
 '2026-12-25':'行憲紀念日',
 '2027-01-01':'元旦', // 116年曆尚未核定,元旦為固定日先放
};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const isRed=d=>Object.prototype.hasOwnProperty.call(RED,ymd(d));
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const md=d=>(d.getMonth()+1)+'/'+d.getDate();
function nextRed(from){ // 下一個紅字日(含天數);行事曆沒資料回 null
 for(let i=1;i<=400;i++){const d=addDays(from,i);if(isRed(d))return{d,days:i};}
 return null;
}

// ---------- 狀態 ----------

 holiday:isRed(addDays(today,1)), // holiday=「明天」是紅字(自動帶入行事曆,可手動改;給綠長春假日量用)
 data:{}}; // data[vid][itemIndex] = {stock:number|null, on:bool, qty:string}
const tomorrow=()=>(today.getDay()+1)%7;
const isWeekendOrRed=()=>S.holiday||tomorrow()===0||tomorrow()===6; // 綠長春假日量:明天是週末或紅字→用假日量
VENDORS.forEach(v=>{S.data[v.id]=v.items.map(()=>({stock:null,on:false,qty:''}))});
try{const saved=JSON.parse(localStorage.getItem('pmcount-'+today.toDateString()));
 if(saved){S.person=saved.person;Object.assign(S.data,saved.data);}}catch(e){} // holiday 一律由行事曆算,不再從存檔還原(避免舊的手動切換蓋掉)
// 品項清單有新增時,把舊存檔補齊到相同長度,避免當機
VENDORS.forEach(v=>{const a=S.data[v.id]||[];while(a.length<v.items.length)a.push({stock:null,on:false,qty:''});S.data[v.id]=a;});
function save(){try{localStorage.setItem('pmcount-'+today.toDateString(),JSON.stringify({person:S.person,holiday:S.holiday,data:S.data}))}catch(e){};logToday()}
// 背景紀錄:每天誰點貨(自動,寫進手機的本機儲存)
function logbook(){try{return JSON.parse(localStorage.getItem('pmcount-log'))||{}}catch(e){return{}}}
function logToday(){
 if(!S.person||!S.person.trim())return;
 const lb=logbook();
 const k=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
 lb[k]={person:S.person.trim(),dow:DOW[today.getDay()]};
 try{localStorage.setItem('pmcount-log',JSON.stringify(lb))}catch(e){}
}

// ---------- 計算 ----------
function calcItem(it,st){
 if(st.stock===null||st.stock==='')return null;
 const s=Number(st.stock); if(isNaN(s))return null;
 if(it.type==='par'){
  const par=(it.parHoliday&&isWeekendOrRed())?it.parHoliday:it.par;
  // kg 品項補到 0.1kg 精度(蒜片常備才 0.3kg,進位到整數會超叫);顆/包/罐類進位到整數
  const step=it.u==='kg'?0.1:1;
  const need=Math.max(0,Math.round(Math.ceil((par-s)/step-1e-9)*step*10)/10);
  return need>0?{text:need+' '+it.u,order:true}:{text:'不用叫',order:false};
 }
 if(it.type==='trig'){
  const hit=it.cmp==='le'?s<=it.th:s<it.th;
  return hit?{text:it.oq,order:true}:{text:'不用叫',order:false};
 }
 return null;
}
function isOrderDay(v){ // 固定點貨日(2026-08-29 店家確認);見紅休廠商遇紅字日停點
 if(v.red&&todayRedName)return false;
 return v.days.includes(today.getDay());
}
function nextOrderDate(v,from){ // from 之後(不含當天)最近的一個排程點貨日
 for(let i=1;i<=21;i++){const d=addDays(from,i);if(v.days.includes(d.getDay()))return d;}
 return null;
}
// 連假預警:下個點貨日遇紅字會停點 → 必須在「這一次」點貨就提醒多備
// (例:申崧只有週一點;若下週一是連假 → 這週一點貨時就要多叫,撐到下下個能點的日子)
function holidayWarn(v,from){
 from=from||today;
 if(!v.red)return null;
 const n1=nextOrderDate(v,from);
 if(!n1||!isRed(n1))return null;
 let n2=n1;while(n2&&isRed(n2))n2=nextOrderDate(v,n2);
 return {skip:n1,resume:n2,name:RED[ymd(n1)]};
}
function vendorProgress(v){
 const st=S.data[v.id];let done=0,orders=0;
 v.items.forEach((it,i)=>{
  if(it.type==='spec'){if(st[i].on){done++;orders++}return;}
  const r=calcItem(it,st[i]);
  if(r){done++;if(r.order)orders++;}
 });
 return{done,total:v.items.filter(it=>it.type!=='spec').length,orders};
}
function vendorMsg(v){
 const st=S.data[v.id];const lines=[];
 v.items.forEach((it,i)=>{
  if(it.type==='spec'){
   if(st[i].on)lines.push('▸ '+it.n+' '+(st[i].qty||it.oq||'(數量待填)'));
   return;
  }
  const r=calcItem(it,st[i]);
  if(r&&r.order)lines.push('▸ '+it.n+' '+r.text);
 });
 if(!lines.length)return null;
 const d=(today.getMonth()+1)+'/'+today.getDate();
 let m='【PM Pasta 永和店 叫貨】'+d+'('+DOW[today.getDay()]+')\n'+lines.join('\n');
 const w=isOrderDay(v)?holidayWarn(v):null; // 連假預警也寫進 LINE 訊息,廠商跟店裡都看得到
 if(w)m+='\n※ 下次點貨日 '+md(w.skip)+' 遇'+w.name+'停點'+(w.resume?',下次可點:'+md(w.resume):'');
 if(S.person)m+='\n點貨人:'+S.person;
 return m;
}

// 每日點貨紀錄:讀出每天存下的點貨資料(最近 30 天)
function dayRecords(){
 const out=[];
 for(let i=0;i<localStorage.length;i++){
  const k=localStorage.key(i);
  if(!k||k.indexOf('pmcount-')!==0||k==='pmcount-log')continue;
  const d=new Date(k.slice(8));if(isNaN(d))continue;
  try{const rec=JSON.parse(localStorage.getItem(k));if(rec&&rec.data)out.push({d,rec})}catch(e){}
 }
 return out.sort((a,b)=>b.d-a.d).slice(0,30);
}
function renderHistory(){
 const blocks=dayRecords().map(({d,rec})=>{
  const persons=[];const addP=p=>{if(p&&p.trim()&&!persons.includes(p.trim()))persons.push(p.trim())};
  addP(rec.person);
  const vparts=[];
  VENDORS.forEach(v=>{
   const st=(rec.data&&rec.data[v.id])||[];
   const lines=[];
   v.items.forEach((it,i)=>{
    const s=st[i];if(!s)return;
    if(s.by)addP(s.by);

    if(it.type==='spec'){
     if(s.on)lines.push('<div class="hitem"><span>'+(i+1)+'. '+esc(it.n)+'</span><span class="hres">叫 '+esc(s.qty||it.oq||'?')+'</span>'+by+'</div>');
     return;
    }
    if(s.stock===null||s.stock==='')return;
    const n=Number(s.stock);let res;
    if(it.type==='par'){
     const par=(it.parHoliday&&rec.holiday)?it.parHoliday:it.par;
     const step=it.u==='kg'?0.1:1;
     const need=Math.max(0,Math.round(Math.ceil((par-n)/step-1e-9)*step*10)/10);
     res=need>0?'叫 '+need+' '+it.u:'不用叫';
    }else{
     const hit=it.cmp==='le'?n<=it.th:n<it.th;res=hit?'叫 '+it.oq:'不用叫';
    }
    lines.push('<div class="hitem"><span>'+(i+1)+'. '+esc(it.n)+'</span><span class="hstock">庫存 '+esc(s.stock)+'</span><span class="hres'+(res==='不用叫'?' dim':'')+'">'+res+'</span>'+by+'</div>');

   (vparts.length?vparts.join(''):'<div class="empty" style="padding:8px 0">這天沒有點貨資料</div>')+'</div>';
 }).join('');
 app.innerHTML='<div class="vhead"><button class="back" id="bk">‹ 首頁</button><div><div class="t">每日點貨紀錄</div><div class="d">自動保存;每筆都標誰輸入的(正式系統會存雲端)</div></div></div>'+
  '<main>'+(blocks||'<div class="card empty">還沒有任何紀錄,點過貨就會自動出現</div>')+'</main>';
 document.getElementById('bk').onclick=()=>{S.view='home';render();window.scrollTo(0,0)};
}

  '<h2>今天點貨的人是</h2><div class="card" style="display:flex;flex-direction:column;gap:10px">'+
  '<input id="pname" class="pinput" placeholder="輸入你的名字" value="'+esc(S.person||'')+'">'+
  (recentNames().length?'<div class="people"><span style="font-size:13px;color:var(--sub);align-self:center">最近:</span>'+recentNames().map(p=>'<button class="chip" data-p="'+esc(p)+'">'+esc(p)+'</button>').join('')+'</div>':'')+
  '</div>'+
  '<h2>今日廠商('+VENDORS.filter(isOrderDay).length+' 家要點)</h2><div class="card" style="padding:2px 16px">'+vlist+'</div>'+
  '<button class="cta" id="tosum" '+(anyMsg?'':'disabled')+'>產生今日叫貨訊息</button>'+
  '<button class="ghost" id="tohist">📒 每日點貨紀錄</button>'+
  '</main><footer>雛形說明:資料來自「永和店叫貨規則 優化版」;10 家廠商到齊(2026-08-29 津華、央廚加入)。行程規則(2026-08-29 確認):每家廠商固定點貨日、隔天送達;點貨日遇紅字(已內建 2026 官方行事曆)→ 當天停點,並在前一個點貨日提醒多備。輸入只存在這支手機,還沒連資料庫。</footer>';
 document.getElementById('pname').oninput=e=>{S.person=e.target.value;save()};
 app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{S.person=b.dataset.p;render()});
 app.querySelectorAll('[data-v]').forEach(r=>r.onclick=()=>{S.vid=r.dataset.v;S.view='vendor';render();window.scrollTo(0,0)});
 const ts=document.getElementById('tosum');if(ts)ts.onclick=()=>{S.view='summary';render();window.scrollTo(0,0)};
 document.getElementById('tohist').onclick=()=>{S.view='history';render();window.scrollTo(0,0)};
}
function renderVendor(){
 const v=VENDORS.find(x=>x.id===S.vid);const st=S.data[v.id];const p=vendorProgress(v);
 const items=v.items.map((it,i)=>{
  const tag=it.type==='par'?'<span class="tag t-par">補到滿</span>':it.type==='trig'?'<span class="tag t-trig">碰到門檻</span>':'<span class="tag t-spec">特殊</span>';
  const pend=it.pend?' <span class="tag t-pend">'+esc(it.pend)+'</span>':'';
  const parNow=(it.parHoliday&&isWeekendOrRed())?it.parHoliday:it.par;
  const rule=it.type==='par'?('每天補到 '+parNow+' '+it.u+(it.rule?'('+esc(it.rule)+')':'')):esc(it.rule||'');
  let mid;
  if(it.type==='spec'){
   mid='<div class="sw"><button data-sw="'+i+'" class="'+(st[i].on?'on':'')+'"></button><span>'+(st[i].on?'要叫':'不叫')+'</span></div>'+
    (st[i].on?'<input data-q="'+i+'" value="'+esc(st[i].qty||it.oq||'')+'" placeholder="數量" style="width:90px;height:40px;border:1.5px solid var(--input-line);border-radius:10px;background:var(--input);color:var(--ink);text-align:center;font-family:inherit;font-size:15px">':'');
  }else{
   const r=calcItem(it,st[i]);
   const res=r===null?'<div class="result">應叫<b>—</b></div>':(r.order?'<div class="result order">應叫<b>'+esc(r.text)+'</b></div>':'<div class="result zero">應叫<b>0</b></div>');
   // 輸入單位直接標在輸入格上(紅字),避免「品項有兩種單位、不知道填哪個」
   mid='<div class="stock"><button data-m="'+i+'">−</button><input data-s="'+i+'" inputmode="decimal" placeholder="?" value="'+(st[i].stock===null?'':st[i].stock)+'"><span class="sunit">'+it.u+'</span><button data-a="'+i+'">＋</button></div>'+res;
  }
  // 數字輸入的品項:單位標在輸入格,名稱旁不重複標(特殊品項沒有輸入格,單位留在名稱旁)
  const nameUnit=it.type==='spec'?'<span class="iunit">'+it.u+'</span>':'';
  // 編號=資料順序,與 xlsx 規則檔「編號」欄一致(調整品項順序時的對照依據)
  return '<div class="item"><div class="itop"><div class="row1"><span class="inum">'+(i+1)+'</span><span class="iname">'+esc(it.n)+'</span>'+nameUnit+'</div>'+mid+'</div>'+
   '<div class="irule">'+tag+(rule?'<span>'+rule+'</span>':'')+pend+'</div></div>';
 }).join('');
 const vw=isOrderDay(v)?holidayWarn(v):null;
 app.innerHTML='<div class="vhead"><button class="back" id="bk">‹ 首頁</button><div><div class="t">'+v.name+'</div><div class="d">'+esc(v.note)+' · 已點 '+p.done+'/'+p.total+(isOrderDay(v)?'':' · 行程顯示今天不用點,仍可照點')+'</div>'+
  (vw?'<div class="vwarn">⚠ 下次點貨日 '+md(vw.skip)+' 遇'+esc(vw.name)+'停點,這次請多備'+(vw.resume?'到 '+md(vw.resume):'')+'</div>':'')+'</div></div>'+
  '<main><div class="note">庫存照輸入格<b style="color:var(--accent)">紅字單位</b>數;可填小數:半=0.5、1/3≈0.33</div>'+items+'</main>'+
  '<div class="bottom"><button class="cta" id="dn">這家點完了,回首頁</button></div>';
 document.getElementById('bk').onclick=document.getElementById('dn').onclick=()=>{S.view='home';render();window.scrollTo(0,0)};
 const mark=i=>{st[i].by=(S.person||'').trim()}; // 每一筆記下是誰輸入的(多人輪流點時換名字即可)
 app.querySelectorAll('[data-s]').forEach(inp=>inp.oninput=()=>{const i=+inp.dataset.s;st[i].stock=inp.value===''?null:inp.value;mark(i);refreshVendor()});
 app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const i=+b.dataset.a;st[i].stock=(Number(st[i].stock)||0)+1;mark(i);render()});
 app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const i=+b.dataset.m;st[i].stock=Math.max(0,(Number(st[i].stock)||0)-1);mark(i);render()});
 app.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{const i=+b.dataset.sw;st[i].on=!st[i].on;mark(i);render()});
 app.querySelectorAll('[data-q]').forEach(inp=>inp.oninput=()=>{const i=+inp.dataset.q;st[i].qty=inp.value;mark(i);save()});
 function refreshVendor(){ // 更新應叫顯示但不重畫(避免輸入中斷)
  v.items.forEach((it,i)=>{
   if(it.type==='spec')return;
   const r=calcItem(it,st[i]);
   const el=app.querySelector('[data-s="'+i+'"]');if(!el)return;
   const res=el.closest('.itop').querySelector('.result');
   if(r===null){res.className='result';res.innerHTML='應叫<b>—</b>';}
   else if(r.order){res.className='result order';res.innerHTML='應叫<b>'+esc(r.text)+'</b>';}
   else{res.className='result zero';res.innerHTML='應叫<b>0</b>';}
  });save();
 }
}
function renderSummary(){
 const blocks=VENDORS.filter(v=>isOrderDay(v)||vendorMsg(v)).map(v=>{
  const m=vendorMsg(v);
  return '<div class="msg"><div class="mh">'+v.name+(m?'<button class="copy" data-c="'+v.id+'">複製</button>':'')+'</div>'+
   (m?'<pre id="pre-'+v.id+'">'+esc(m)+'</pre>':'<div class="empty">今日無需叫貨(或尚未點)</div>')+'</div>';
 }).join('');
 app.innerHTML='<div class="vhead"><button class="back" id="bk">‹ 首頁</button><div><div class="t">今日叫貨訊息</div><div class="d">一家一則,複製後貼到該廠商的 LINE 群組</div></div></div>'+
  '<main>'+blocks+'<button class="ghost" id="bk2">回首頁繼續點</button></main>';
 document.getElementById('bk').onclick=document.getElementById('bk2').onclick=()=>{S.view='home';render();window.scrollTo(0,0)};
 app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
  const t=document.getElementById('pre-'+b.dataset.c).textContent;
  const ok=()=>{b.textContent='已複製 ✓';b.classList.add('done');setTimeout(()=>{b.textContent='複製';b.classList.remove('done')},2000)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok).catch(()=>fallback(t,ok));}
  else fallback(t,ok);
  function fallback(txt,cb){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');cb()}catch(e){alert('請長按文字手動複製')}document.body.removeChild(ta);}
 });
}
render();
</script>
