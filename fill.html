}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1713; --card:#26211B; --ink:#EDE7DE; --sub:#A79C8F; --line:#3A332B;
    --accent:#E0584A; --accent-ink:#FFFFFF; --accent-soft:#45231F;
    --ok:#6FBF87; --ok-soft:#22382A; --warn:#E0993F; --warn-soft:#3E2F1B;
    --info:#82A9DB; --info-soft:#243348; --input:#2E2822; --input-line:#55493C;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1713; --card:#26211B; --ink:#EDE7DE; --sub:#A79C8F; --line:#3A332B;
  --accent:#E0584A; --accent-ink:#FFFFFF; --accent-soft:#45231F;
  --ok:#6FBF87; --ok-soft:#22382A; --warn:#E0993F; --warn-soft:#3E2F1B;
  --info:#82A9DB; --info-soft:#243348; --input:#2E2822; --input-line:#55493C;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;font-size:16px;line-height:1.55}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
header.top,.vhead{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
.brand{font-family:"Noto Serif TC",serif;font-weight:700;font-size:19px}
.brand em{color:var(--accent);font-style:normal}
.store{font-size:13px;color:var(--sub);letter-spacing:.06em}
main{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px}
h2{font-size:14px;letter-spacing:.12em;color:var(--sub);font-weight:700;margin:6px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--input-line);background:var(--input);color:var(--ink);border-radius:999px;padding:8px 16px;font-size:15px;font-family:inherit;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.chip.day{padding:6px 0;width:40px;text-align:center}
.pinput{height:46px;border:1.5px solid var(--input-line);border-radius:10px;background:var(--input);color:var(--ink);font-family:inherit;font-size:17px;padding:0 14px;width:100%}
.pinput:focus,.num:focus,.txt:focus{outline:2px solid var(--accent);outline-offset:1px}
.guide{font-size:14px;line-height:1.75;margin:0;padding-left:20px}
.guide b{color:var(--accent)}
.vrow{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.vrow:last-child{border-bottom:none}
.vname{font-weight:700;font-size:17px}
.vsub{font-size:12px;color:var(--sub)}
.vstat{margin-left:auto;font-size:13px;font-variant-numeric:tabular-nums;color:var(--sub);white-space:nowrap}
.vstat .done{color:var(--ok);font-weight:700}
.arrow{color:var(--sub)}
.cta{display:block;width:100%;border:none;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-family:inherit;font-size:17px;font-weight:700;padding:15px;cursor:pointer}
.cta:disabled{opacity:.4;cursor:default}
.ghost{display:block;width:100%;border:1.5px solid var(--input-line);border-radius:12px;background:var(--card);color:var(--ink);font-family:inherit;font-size:15px;padding:12px;cursor:pointer}
.link{border:none;background:none;color:var(--sub);font-family:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:4px}
.back{border:none;background:none;color:var(--accent);font-size:15px;font-family:inherit;cursor:pointer;padding:4px 6px 4px 0;font-weight:700}
.vhead .t{font-weight:700;font-size:17px}
.vhead .d{font-size:12px;color:var(--sub)}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.item.unused{opacity:.55}
.item.filled{border-color:var(--ok)}
.ihead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.inum{font-style:normal;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.iname{font-weight:700;font-size:18px}
.tag{font-size:12px;border-radius:5px;padding:1px 8px;font-weight:700}
.t-par{background:var(--ok-soft);color:var(--ok)}
.t-trig{background:var(--warn-soft);color:var(--warn)}
.t-spec{background:var(--info-soft);color:var(--info)}
.ref{font-size:13px;color:var(--sub)}
.fields{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.f{display:flex;align-items:center;gap:6px;font-size:15px}
.num{width:78px;height:40px;border:1.5px solid var(--input-line);border-radius:9px;background:var(--input);color:var(--ink);text-align:center;font-family:inherit;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.num::placeholder,.txt::placeholder{color:var(--sub);opacity:.6;font-weight:400;font-size:13px}
.u{color:var(--accent);font-weight:700}
.txt{height:38px;border:1.5px solid var(--input-line);border-radius:9px;background:var(--input);color:var(--ink);font-family:inherit;font-size:14px;padding:0 10px;flex:1;min-width:0}
.ifoot{display:flex;align-items:center;gap:10px}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--sub);white-space:nowrap;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.sw{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.sw input{width:22px;height:22px;accent-color:var(--ok)}
.xrow{display:flex;gap:6px;align-items:center}
.xrow .txt{flex:1}
.xrow .small{flex:0 0 64px}
.del{border:none;background:none;color:var(--accent);font-size:20px;cursor:pointer;padding:0 4px}
.bottom{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.miss{font-size:14px;line-height:1.7}
.miss b{color:var(--warn)}
pre.out{margin:0;white-space:pre-wrap;word-break:break-all;font-family:inherit;font-size:13.5px;line-height:1.65;max-height:320px;overflow:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:50}
@media (prefers-reduced-motion:no-preference){.toast{transition:opacity .3s}}
footer{padding:8px 16px 28px;font-size:11.5px;color:var(--sub);line-height:1.7}
</style>

const STORES=['東湖店','永春店','土城店','中央廚房'];
const DOW='日一二三四五六';
const KEY='pmfill-v1';
let DB;try{DB=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){DB={}}
DB.stores=DB.stores||{};
const S={view:'home',vid:null};
const app=document.getElementById('app');
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function storeData(){
 if(!DB.store)return null;
 const s=DB.stores[DB.store]=DB.stores[DB.store]||{};
 VENDORS.forEach(v=>{const d=s[v.id]=s[v.id]||{days:null,items:[],extra:[]};while(d.items.length<v.items.length)d.items.push({});});
 return s;
}
const has=x=>x!=null&&String(x).trim()!=='';
const oqNum=it=>{const m=String(it.oq||'').match(/^([\d.]+)/);return m?m[1]:''};
const oqUnit=it=>String(it.oq||'').replace(/^[\d.]+\s*/,'')||it.u;
const cmpText=it=>it.cmp==='le'?'剩(含)':'低於';
const typeLabel=it=>it.type==='par'?'補到滿':it.type==='trig'?'碰到設定庫存':'特殊';
function daysOf(v,d){return d.days||v.days}
function isDone(it,e){
 if(e.unused)return true;
 if(it.type==='par')return has(e.par)&&(!it.parHoliday||has(e.hol))&&(!it.parTwo||has(e.two));
 if(it.type==='trig')return has(e.th)&&has(e.oq);
 return !!e.same||has(e.note);
}
function progress(v,d){const n=v.items.filter((it,i)=>isDone(it,d.items[i])).length;return{n,total:v.items.length}}
function refText(it){
 if(it.type==='par')return '永和:每天補到 '+it.par+(it.parHoliday?'/假日 '+it.parHoliday:'')+(it.parTwo?'/兩天 '+it.parTwo:'')+' '+it.u;
 return '永和:'+(it.rule||'');
}

  if(it.parHoliday)h+='<span class="f">假日補到 '+n('hol','永和 '+it.parHoliday)+'<span class="u">'+esc(it.u)+'</span></span>';

 }

// ---------- 產生結果 ----------
function parCell(it,e){
 if(!it.parHoliday&&!it.parTwo)return e.par||'';
 return '平日'+(e.par||'?')+(it.parHoliday?'/假日'+(e.hol||'?'):'')+(it.parTwo?'/兩天'+(e.two||'?'):'');
}
function itemLine(it,e,i){
 const no=(i+1)+' '+it.n+':';
 if(e.unused)return no+'不用';
 if(!isDone(it,e))return no+'(未填)';
 let t;
 if(it.type==='par')t='常備 '+parCell(it,e)+' '+it.u;
 else if(it.type==='trig')t=cmpText(it)+' '+e.th+' '+it.u+' → 叫 '+e.oq+' '+oqUnit(it);
 else t=e.same?'照永和規則':'見備註';
 return no+t+(has(e.note)?'(備註:'+e.note+')':'');
}
function buildText(){
 const s=storeData();const now=new Date();
 const L=['【PM Pasta 分店叫貨規則】'+DB.store,'填寫人:'+(DB.person||'(未填)')+'|'+now.getFullYear()+'/'+(now.getMonth()+1)+'/'+now.getDate()];
 VENDORS.forEach(v=>{
  const d=s[v.id];L.push('','■ '+v.name+'(點貨日:'+daysOf(v,d).map(x=>DOW[x]).join('、')+')');
  v.items.forEach((it,i)=>L.push(itemLine(it,d.items[i],i)));
  d.extra.filter(x=>has(x.name)).forEach(x=>L.push('+ 新增 '+x.name+(has(x.unit)?'('+x.unit+')':'')+':'+(x.rule||'')));
 });
 return L.join('\n');
}
function buildWorkbook(){
 const s=storeData();const wb=XLSX.utils.book_new();const now=new Date();
 let done=0,total=0;
 VENDORS.forEach(v=>{const p=progress(v,s[v.id]);done+=p.n;total+=p.total});
 const info=[['PM Pasta 分店叫貨規則 — 手機填寫結果'],[],['店名',DB.store],['填寫人',DB.person||''],
  ['產生時間',now.toLocaleString('zh-TW')],['完成度',done+' / '+total+' 項'],[],
  ['說明','各廠商分頁欄位與「分店叫貨規則_填寫範本.xlsx」相同;「待釐清問題」欄寫「不用」= 這家店沒用這項;「未填」= 還沒填。']];
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(info),'填寫資訊');
 VENDORS.forEach((v,vi)=>{
  const d=s[v.id];
  const rows=[[(vi+1)+' '+v.name+'  (店名:'+DB.store+';點貨日:'+daysOf(v,d).map(x=>'週'+DOW[x]).join('、')+')'],
   ['編號','品項','規則型態','單位','常備量','觸發門檻','叫貨量','換算/備註','待釐清問題']];
  v.items.forEach((it,i)=>{
   const e=d.items[i];const flag=e.unused?'不用':(isDone(it,e)?'':'未填');
   if(it.type==='par')rows.push([i+1,it.n,typeLabel(it),it.u,parCell(it,e),'—','—',e.note||'',flag]);
   else if(it.type==='trig')rows.push([i+1,it.n,typeLabel(it),it.u,'—',has(e.th)?(it.cmp==='le'?'剩':'低於')+e.th+it.u:'',has(e.oq)?e.oq+oqUnit(it):'',e.note||'',flag]);
   else rows.push([i+1,it.n,typeLabel(it),it.u,'—','—',e.same?'照永和規則':'見備註',e.note||'',flag]);
  });
  d.extra.filter(x=>has(x.name)).forEach(x=>rows.push(['新增',x.name,'',x.unit||'','','','',x.rule||'','新品項']));
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:6},{wch:22},{wch:14},{wch:6},{wch:16},{wch:12},{wch:12},{wch:30},{wch:10}];
  XLSX.utils.book_append_sheet(wb,ws,((vi+1)+' '+v.name).slice(0,31));
 });
 return wb;
}
function fileName(){const n=new Date();return 'PM_Pasta_'+DB.store+'_叫貨規則_'+n.getFullYear()+String(n.getMonth()+1).padStart(2,'0')+String(n.getDate()).padStart(2,'0')+'.xlsx'}
function xlsxBlob(){const out=XLSX.write(buildWorkbook(),{bookType:'xlsx',type:'array'});return new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
function download(){
 const a=document.createElement('a');a.href=URL.createObjectURL(xlsxBlob());a.download=fileName();
 document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function copyText(txt){
 const ok=()=>toast('已複製,貼到 LINE 就可以');
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok).catch(()=>fb());else fb();
 function fb(){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(e){alert('請長按下方文字手動複製')}ta.remove()}
}
function renderResult(){
 const s=storeData();
 const miss=VENDORS.map(v=>{const d=s[v.id];const m=v.items.filter((it,i)=>!isDone(it,d.items[i])).map(it=>it.n);return{v,m}}).filter(x=>x.m.length);
 const txt=buildText();
 const canShare=!!(navigator.canShare&&window.File&&(()=>{try{return navigator.canShare({files:[new File(['x'],'t.xlsx')]})}catch(e){return false}})());
 app.innerHTML='<div class="vhead"><button class="back" id="bk">‹ 首頁</button><div><div class="t">傳給管理員</div><div class="d">'+esc(DB.store)+' · 填寫人:'+esc(DB.person||'(未填)')+'</div></div></div><main>'+
  (miss.length?'<div class="card miss"><b>還有 '+miss.reduce((a,x)=>a+x.m.length,0)+' 項沒填</b>(可以先傳,之後補):<br>'+
   miss.map(x=>esc(x.v.name)+':'+x.m.map(esc).join('、')).join('<br>')+'</div>'
   :'<div class="card" style="color:var(--ok);font-weight:700">✓ 全部填完了</div>')+
  (DB.person?'':'<div class="card miss"><b>還沒填名字</b>,請回首頁填上,管理員才知道是誰填的。</div>')+
  (canShare?'<button class="cta" id="share">📤 分享 Excel 到 LINE</button>':'')+
  '<button class="'+(canShare?'ghost':'cta')+'" id="dl">⬇ 下載 Excel 檔</button>'+
  '<button class="ghost" id="cp">📋 複製文字版(直接貼 LINE)</button>'+
  '<h2>文字版預覽</h2><div class="card"><pre class="out">'+esc(txt)+'</pre></div></main>';
 document.getElementById('bk').onclick=()=>{S.view='home';render();window.scrollTo(0,0)};
 if(typeof XLSX==='undefined'){['share','dl'].forEach(id=>{const b=document.getElementById(id);if(b){b.disabled=true;b.textContent='Excel 元件載入失敗,請用「複製文字版」'}})}
 const sh=document.getElementById('share');if(sh)sh.onclick=async()=>{
  try{await navigator.share({files:[new File([xlsxBlob()],fileName(),{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})],title:'PM Pasta '+DB.store+' 叫貨規則'})}
  catch(e){if(e&&e.name!=='AbortError')download()}
 };
 document.getElementById('dl').onclick=download;
 document.getElementById('cp').onclick=()=>copyText(txt);
}
function render(){
 if(S.view==='vendor'&&DB.store)renderVendor();
 else if(S.view==='result'&&DB.store)renderResult();
 else renderHome();
}
render();
</script>
